name: Refresh verified bounty radar

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest -v
      - name: Refresh radar
        run: python monitor_fuentes_bounty.py --output bounty-radar.json
      - name: Commit changed radar
        run: |
          if git diff --quiet -- bounty-radar.json; then
            echo "Radar is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bounty-radar.json
          git commit -m "data: refresh verified bounty radar"
          git push
